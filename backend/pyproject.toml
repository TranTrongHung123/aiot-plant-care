[project]
name = "aiot-plant-care-backend"
version = "0.1.0"
description = "FastAPI backend environment for AIoT Plant Care (scaffold only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "paho-mqtt>=2.1,<3",
    "minio>=7.2,<8",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "pillow>=11,<13",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "ultralytics==8.3.203",
    "xgboost==3.0.5",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "requests>=2.32,<3",
    "scipy>=1.14,<2",
    "tqdm>=4.67,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
